<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Autobusy Białogard</title>
  <meta name="description" content="Najbliższe odjazdy i przyjazdy autobusów ZKM Białogard dla wybranego przystanku.">
  <meta name="theme-color" content="#b00d27">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikony/ikona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikony/ikona-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Autobusy">
  <link rel="stylesheet" href="styl.css">
</head>
<body>
  <header class="gora">
    <div class="gora-wiersz">
      <button id="ulubiony" class="ikona-btn" type="button" aria-pressed="false" aria-label="Dodaj do ulubionych">☆</button>
      <button id="wybierz" class="przystanek-btn" type="button" aria-haspopup="dialog">
        <span class="etykieta">Przystanek</span>
        <span id="nazwa-przystanku" class="nazwa">—</span>
      </button>
    </div>
    <div class="gora-info">
      <span id="teraz"></span>
      <button id="zmien-czas" class="pigulka" type="button" aria-expanded="false">Zmień czas</button>
    </div>
    <div id="panel-czasu" class="panel-czasu" hidden>
      <input id="czas" type="datetime-local" aria-label="Pokaż rozkład na datę i godzinę">
      <button id="reset-czasu" type="button" class="pigulka">Teraz</button>
    </div>
    <nav class="zakladki" role="tablist">
      <button type="button" role="tab" data-tryb="odjazdy" aria-selected="true">Odjazdy</button>
      <button type="button" role="tab" data-tryb="przyjazdy" aria-selected="false">Przyjazdy</button>
      <button type="button" role="tab" data-tryb="rozklad" aria-selected="false">Rozkład</button>
    </nav>
  </header>

  <main>
    <div id="filtry" class="filtry" role="group" aria-label="Filtry"></div>
    <p id="info" class="info"></p>
    <ul id="lista" class="lista"></ul>
    <section id="tabliczka" class="tabliczka" hidden></section>

    <footer>
      <p id="wersja"></p>
      <p>Źródło: <a href="https://www.zkmb.pl/rozklad-jazdy/">zkmb.pl/rozklad-jazdy</a>.
        Godziny przyjazdów i dojazdów są szacowane z czasu jazdy w rozkładzie.
        Tolerancja punktualności: +1 / −3 min.</p>
    </footer>
  </main>

  <dialog id="szukaj" class="szukaj" aria-label="Wybierz przystanek">
    <div class="szukaj-gora">
      <input id="szukaj-pole" type="search" placeholder="Szukaj przystanku…" autocomplete="off" aria-label="Szukaj przystanku">
      <button id="szukaj-zamknij" type="button" class="ikona-btn" aria-label="Zamknij">✕</button>
    </div>
    <div id="szukaj-wyniki" class="szukaj-wyniki"></div>
  </dialog>

  <dialog id="cel-okno" class="szukaj" aria-label="Dokąd jadę">
    <div class="szukaj-gora">
      <input id="cel-pole" type="search" placeholder="Dokąd jedziesz?" autocomplete="off" aria-label="Szukaj przystanku docelowego">
      <button id="cel-zamknij" type="button" class="ikona-btn" aria-label="Zamknij">✕</button>
    </div>
    <div id="cel-wyniki" class="szukaj-wyniki"></div>
  </dialog>

  <script src="data/rozklad.js"></script>
  <script src="app.js"></script>
</body>
</html>
