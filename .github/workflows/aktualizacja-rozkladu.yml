name: Aktualizacja rozkładu

# Codziennie sprawdza, czy ZKMB zmienił PDF-y z rozkładem.
# - bez zmian: zapisuje na master tylko datę sprawdzenia (data/sprawdzono.js) – strona pokazuje
#   „sprawdzono z zkmb.pl: <dzisiaj>”,
# - zmiany: pobiera nowe dane, uruchamia testy i otwiera pull request (razem z datą sprawdzenia).
on:
  schedule:
    - cron: "17 3 * * *"   # codziennie ok. 5:17 czasu polskiego
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write          # żeby po zapisaniu daty od razu przebudować stronę

concurrency:
  group: aktualizacja-rozkladu
  cancel-in-progress: false

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf

      - name: Pobierz rozkład z zkmb.pl
        id: pobierz
        run: |
          python narzedzia/pobierz_rozklad.py | tee pobieranie.log
          if git diff --quiet -- data/rozklad.js; then
            echo "zmiany=nie" >> "$GITHUB_OUTPUT"
            echo "### ✅ Rozkład jest aktualny" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "zmiany=tak" >> "$GITHUB_OUTPUT"
            {
              echo "### 🔄 Rozkład na zkmb.pl się zmienił"
              echo '```'
              sed -n '/różni się/,$p' pobieranie.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo 'raport<<KONIEC'
              sed -n '/różni się/,$p' pobieranie.log
              echo 'KONIEC'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Zapisz datę sprawdzenia (rozkład bez zmian)
        if: steps.pobierz.outputs.zmiany == 'nie' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sprawdzono.js
          if git diff --cached --quiet; then
            echo "Data sprawdzenia bez zmian."
            exit 0
          fi
          git commit -m "Sprawdzono rozkład z zkmb.pl: bez zmian ($(date +%F))"
          # do 3 prób – gdyby ktoś w międzyczasie coś wmergował
          for proba in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((proba * 5))
          done
          exit 1

      - name: Przebuduj stronę (GitHub Pages)
        # commit z GITHUB_TOKEN może nie uruchomić budowania Pages, więc zlecamy je jawnie
        if: steps.pobierz.outputs.zmiany == 'nie' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent

      - name: Uzupełnij położenie przystanków (OpenStreetMap)
        if: steps.pobierz.outputs.zmiany == 'tak'
        continue-on-error: true
        run: python narzedzia/pobierz_gps.py

      - name: Testy nowych danych
        if: steps.pobierz.outputs.zmiany == 'tak'
        run: python -m unittest discover tests -v

      - name: Otwórz pull request
        if: steps.pobierz.outputs.zmiany == 'tak'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automat/aktualizacja-rozkladu
          delete-branch: true
          add-paths: |
            data/rozklad.js
            data/przystanki_gps.js
            data/sprawdzono.js
          commit-message: "Aktualizacja rozkładu z zkmb.pl"
          title: "Aktualizacja rozkładu z zkmb.pl"
          body: |
            Automatyczne sprawdzenie wykryło zmiany w tabliczkach PDF na https://www.zkmb.pl/rozklad-jazdy/.

            ```
            ${{ steps.pobierz.outputs.raport }}
            ```

            Testy danych przeszły. Sprawdź stronę i zmerguj, żeby opublikować nowy rozkład.
